<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA | United Mothers for Milk Association</title>
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Imong CSS styles diri - nagpabilin kini sa orihinal */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 30%, #E6F7FF 0%, #C4ECFF 70%, #B5E6FF 100%) fixed; margin: 0; padding: 0; color: #1A365D; }
        /* ... (Ibilin ang tibuok CSS section nga naa na nimo daan) ... */
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #BCE3FF; position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-graphic { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .logo { font-size: 28px; font-weight: 900; color: #112A61; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .korean-text { font-family: "Malgun Gothic", sans-serif; color: #E25C80; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .hero-section { padding: 40px 40px 60px; text-align: center; }
        .hero-logo-frame { max-width: 380px; width: 100%; }
        .main-content { background: #FFFFFF; padding: 60px 40px; }
        .main-content-wrapper { max-width: 1200px; margin: 0 auto; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .category-card { background: #FFFFFF; border-radius: 24px; border: 2px solid #EAEFF5; padding: 28px; cursor: pointer; }
        .directory-layout { display: flex; gap: 30px; margin-top: 20px; }
        .map-frame-outer { position: relative; width: 100%; height: 440px; border: 3px solid #0F172A; border-radius: 24px; overflow: hidden; }
        /* ... (Siguroha nga naa pa tanan nimong CSS) ... */
    </style>
</head>
<body>

<!-- Header ug Main Content - Ibilin ang imong existing HTML structure -->
<header>
    <div class="logo-container" onclick="resetToGlobalView()">
        <img src="Logo.png" alt="UMMA Header Logo" class="logo-graphic">
        <div class="logo">UMMA <div class="korean-text">엄마</div></div>
    </div>
    <div class="header-actions">
        <button class="header-track-btn" onclick="openTrackModal()">Track Order</button>
        <button class="header-donor-btn" onclick="openDonorDrawer()">Be a Milk Donor</button>
    </div>
</header>

<section class="hero-section">
    <img src="Logo.png" alt="UMMA Logo" class="hero-logo-frame">
</section>

<main class="main-content">
    <div class="main-content-wrapper">
        <div class="section-title">Explore Milk Products</div>
        <div class="cards-grid">
            <div class="category-card" onclick="showProducts('colostrum')"><h3>Colostrum Care Packs</h3></div>
            <div class="category-card" onclick="showProducts('transitional')"><h3>Transitional Milk</h3></div>
            <div class="category-card" onclick="showProducts('mature')"><h3>Mature Milk Batches</h3></div>
        </div>
        <section class="directory-section">
            <div class="directory-layout">
                <div class="directory-list">
                    <div class="directory-item active" onclick="focusLiveHub(this, 'central')">
                        <h4>UMMA Central Hub Clinic</h4>
                    </div>
                </div>
                <div class="directory-map-graphic">
                    <div class="map-frame-outer">
                        <div id="liveSatelliteMap" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Dinhi ang na-fix nga Javascript section
    const locations = {
        central: { coords: [14.5547, 121.0244], name: "UMMA Central Hub Clinic", zoom: 17 }
    };

    let map;

    document.addEventListener("DOMContentLoaded", () => {
        map = L.map('liveSatelliteMap', { zoomControl: false }).setView([14.5547, 121.0244], 17);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
    });

    function resetToGlobalView() {
        if (map) {
            map.flyTo([14.5547, 121.0244], 17, { animate: true, duration: 1.5 });
        }
    }

    function focusLiveHub(element, key) {
        const target = locations[key];
        if (target && map) {
            map.flyTo(target.coords, target.zoom, { animate: true, duration: 1.5 });
        }
    }

    function showProducts(cat) { alert("Showing: " + cat); }
    function openTrackModal() { document.getElementById('trackModal').style.display = 'flex'; }
    function openDonorDrawer() { document.getElementById('donorDrawer').classList.add('open'); }
    // ... (Idugang ang uban pa nimo nga functions) ...
</script>

</body>
</html>
