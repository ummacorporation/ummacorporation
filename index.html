<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA | United Mothers for Milk Association</title>
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Firebase App SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 30%, #E6F7FF 0%, #C4ECFF 70%, #B5E6FF 100%) fixed; margin: 0; padding: 0; color: #1A365D; }

        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #BCE3FF; position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-graphic { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
        .logo { font-size: 28px; font-weight: 900; color: #112A61; display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        
        .header-track-btn { background: #EDF5FF; color: #112A61; border: 2px solid #BCE3FF; padding: 10px 18px; font-weight: 700; border-radius: 20px; cursor: pointer; }
        .header-donor-btn { background: #4A90E2; color: white; border: none; padding: 10px 18px; font-weight: 700; border-radius: 20px; cursor: pointer; }

        .main-content { background: #FFFFFF; padding: 60px 40px; }
        .main-content-wrapper { max-width: 1200px; margin: 0 auto; }
        
        .category-card { background: #FFFFFF; border-radius: 24px; border: 2px solid #EAEFF5; padding: 28px; cursor: pointer; transition: 0.3s; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        .grab-side-drawer { position: fixed; top: 0; right: -520px; width: 520px; height: 100%; background: #fff; z-index: 3000; transition: 0.4s; padding: 24px; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.1); }
        .grab-side-drawer.open { right: 0; }
        .grab-field { margin-bottom: 15px; }
        .grab-field label { font-weight: 700; display: block; margin-bottom: 5px; }
        .grab-field input, .grab-field select, .grab-field textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .grab-submit-btn { width: 100%; padding: 15px; background: #E25C80; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo-container" onclick="location.reload()">
        <img src="Logo.png" alt="Logo" class="logo-graphic">
        <div class="logo">UMMA</div>
    </div>
    <div class="header-actions">
        <button class="header-track-btn" onclick="openTrackModal()">Track Order</button>
        <button class="header-donor-btn" onclick="openDonorDrawer()">Become a Donor</button>
    </div>
</header>

<main class="main-content">
    <div class="main-content-wrapper">
        <h1>Available Milk Products</h1>
        <div class="cards-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            <div class="category-card" onclick="showProducts('colostrum')">
                <h3>Colostrum Care Packs</h3>
                <p>Nutrient-rich early milk for newborns.</p>
            </div>
            <div class="category-card" onclick="showProducts('transitional')">
                <h3>Transitional Milk</h3>
                <p>Bridge nutrition for growing infants.</p>
            </div>
            <div class="category-card" onclick="showProducts('mature')">
                <h3>Mature Milk</h3>
                <p>Balanced nutrition for sustained growth.</p>
            </div>
        </div>
    </div>
</main>

<!-- Modals and Drawers (Simplified for English) -->
<div id="productsModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
    <div class="products-popup" style="background:#fff; padding:20px; border-radius:15px; width:500px;">
        <h3>Select Product</h3>
        <div id="modalProductList"></div>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<div class="grab-side-drawer" id="receiverDrawer">
    <h2>Request Order</h2>
    <form id="ummaReceiverForm" onsubmit="submitOrder(event)">
        <div class="grab-field"><label>Full Name</label><input type="text" id="orderCustName" required></div>
        <div class="grab-field"><label>Phone Number</label><input type="tel" id="orderCustPhone" required></div>
        <div class="grab-field"><label>Priority Level</label>
            <select id="patientPriority">
                <option value="Emergency">Emergency</option>
                <option value="Normal">Normal</option>
            </select>
        </div>
        <div class="grab-field"><label>Delivery Address</label><textarea id="deliveryAddressText" required></textarea></div>
        <button type="submit" class="grab-submit-btn">Submit Order</button>
    </form>
    <button onclick="dismissActiveDrawer()" style="margin-top:10px;">Cancel</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDFcVKUXi7S0KbIwLAHd9icy502SxIcu4",
    projectId: "umma-milk-system-7bb00",
    // ... rest of your config
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Functions for ordering and tracking in English
async function submitOrder(e) {
    e.preventDefault();
    const orderId = 'UMMA-' + Math.floor(100000 + Math.random() * 900000);
    const orderData = {
        id: orderId,
        customerName: document.getElementById('orderCustName').value,
        status: 'Order Received',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    try {
        await db.collection("orders").doc(orderId).set(orderData);
        alert("Order submitted successfully! Your ID is: " + orderId);
        dismissActiveDrawer();
    } catch (err) {
        alert("Error: " + err.message);
    }
}

function openOrderDrawer(name) {
    document.getElementById('receiverDrawer').classList.add('open');
}

function dismissActiveDrawer() {
    document.getElementById('receiverDrawer').classList.remove('open');
}

function showProducts(cat) { document.getElementById('productsModal').style.display = 'flex'; }
function closePopup() { document.getElementById('productsModal').style.display = 'none'; }
function openTrackModal() { alert("Tracking feature active."); }
function openDonorDrawer() { alert("Donor form opening."); }
</script>

</body>
</html>
