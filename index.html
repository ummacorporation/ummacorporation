<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA | United Mothers for Milk Association</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* CSS RESET */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f8ff; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; padding: 20px 40px; background: white; align-items: center; }
        
        /* LAYOUT CONTAINER */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* MAP STYLING */
        #liveSatelliteMap { width: 100%; height: 400px; border-radius: 20px; border: 3px solid #333; }
        
        /* GRID */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .category-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #ddd; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo-container" onclick="resetToGlobalView()" style="cursor:pointer;">
        <h1>UMMA <span style="color:#E25C80;">엄마</span></h1>
    </div>
</header>

<div class="container">
    <div class="cards-grid">
        <div class="category-card" onclick="showProducts('colostrum')"><h3>Colostrum</h3></div>
        <div class="category-card" onclick="showProducts('transitional')"><h3>Transitional</h3></div>
    </div>

    <div id="liveSatelliteMap" style="margin-top: 30px;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize Map
    let map = L.map('liveSatelliteMap').setView([14.5547, 121.0244], 15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

    // Function to reset map
    function resetToGlobalView() {
        map.flyTo([14.5547, 121.0244], 15);
        console.log("Map reset triggered");
    }

    // Product alert
    function showProducts(cat) {
        alert("Selected: " + cat);
    }
</script>

</body>
</html>
