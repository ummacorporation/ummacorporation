<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA | United Mothers for Milk Association</title>
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Firebase App SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 30%, #E6F7FF 0%, #C4ECFF 70%, #B5E6FF 100%) fixed; margin: 0; padding: 0; color: #1A365D; }

        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #BCE3FF; position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-graphic { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
        .logo { font-size: 28px; font-weight: 900; color: #112A61; display: flex; align-items: center; gap: 10px; }
        .logo .korean-divider { color: #CBD5E1; font-weight: 300; font-size: 24px; }
        .logo .korean-text { font-size: 23px; font-weight: 800; color: #E25C80; }
        .logo span.subtitle-badge { font-size: 13px; font-weight: 600; color: #4A90E2; background: #EDF5FF; padding: 5px 12px; border-radius: 20px; }

        .header-actions { display: flex; gap: 12px; align-items: center; }
        .header-track-btn { background: #EDF5FF; color: #112A61; border: 2px solid #BCE3FF; padding: 10px 18px; font-weight: 700; border-radius: 20px; cursor: pointer; }
        .header-donor-btn { background: #4A90E2; color: white; border: none; padding: 10px 18px; font-weight: 700; border-radius: 20px; cursor: pointer; }

        .hero-section { padding: 40px 40px 60px; text-align: center; display: flex; justify-content: center; }
        .hero-logo-frame { max-width: 380px; width: 100%; object-fit: contain; }

        .main-content { background: #FFFFFF; padding: 60px 40px; }
        .main-content-wrapper { max-width: 1200px; margin: 0 auto; }
        .section-title { font-size: 26px; font-weight: 800; color: #112A61; }
        .section-subtitle { font-size: 15px; color: #64748B; margin-bottom: 35px; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .category-card { background: #FFFFFF; border-radius: 24px; border: 2px solid #EAEFF5; padding: 28px; cursor: pointer; position: relative; transition: 0.3s; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(17, 42, 97, 0.08); }
        .category-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; border-top-left-radius: 22px; border-bottom-left-radius: 22px; }
        .category-card.colostrum::before { background: #F5A623; }
        .category-card.transitional::before { background: #4A90E2; }
        .category-card.mature::before { background: #E25C80; }

        .category-name { font-size: 20px; font-weight: 700; color: #112A61; margin: 0 0 10px 0; }
        .category-desc { font-size: 14.5px; line-height: 1.5; color: #4A5568; margin: 0 0 20px 0; }
        .view-products-text { font-size: 14px; font-weight: 700; color: #4A90E2; display: inline-block; }

        .section-divider { border: 0; height: 1px; background: #EAEFF5; margin: 50px 0; }

        .directory-layout { display: flex; gap: 30px; margin-top: 20px; }
        .directory-list { flex: 1; display: flex; flex-direction: column; gap: 16px; }
        .directory-item { background: #FCFDFE; border: 2px solid #EAEFF5; border-radius: 16px; padding: 20px; cursor: pointer; position: relative; }
        .directory-item.active { border-color: #4A90E2; background: #F4F9FF; }
        .directory-map-graphic { flex: 1.2; min-width: 450px; display: flex; flex-direction: column; }
        .map-frame-outer { position: relative; width: 100%; height: 440px; border: 3px solid #0F172A; border-radius: 24px; overflow: hidden; }

        .custom-leaflet-marker-node { background: transparent !important; border: none !important; }
        .live-core-pin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #FFFFFF; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .pin-central { background: #38BDF8; }
        .pin-delivery { background: #E25C80; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 42, 97, 0.4); backdrop-filter: blur(6px); z-index: 2000; align-items: center; justify-content: center; }
        .products-popup { background: #FFFFFF; width: 95%; max-width: 700px; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; max-height: 90vh; }
        .popup-header { padding: 22px; background: #F4F8FC; border-bottom: 1px solid #EAEFF5; display: flex; justify-content: space-between; align-items: center; }
        .popup-title { margin: 0; font-size: 20px; font-weight: 800; color: #112A61; }
        .close-popup, .close-drawer { font-size: 22px; cursor: pointer; color: #8A9AAD; }

        .shop-product-item { border: 1px solid #EAEFF5; border-radius: 18px; padding: 20px; margin-bottom: 15px; }
        .product-meta-block { display: flex; align-items: flex-start; gap: 20px; width: 100%; }
        .product-thumbnail-frame { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; }
        .shop-info-row { display: flex; justify-content: space-between; flex: 1; width: 100%; }
        .action-buttons-row { display: flex; justify-content: flex-end; margin-top: 12px; border-top: 1px dashed #EAEFF5; padding-top: 12px; }
        .order-btn { background: #E25C80; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .grab-side-drawer { position: fixed; top: 0; right: -520px; width: 520px; height: 100%; background: #fff; z-index: 3000; transition: right 0.4s ease; display: flex; flex-direction: column; box-shadow: -6px 0 30px rgba(15, 23, 42, 0.1); }
        .grab-side-drawer.open { right: 0; }
        .drawer-header { padding: 22px; border-bottom: 1px solid #EAEFF5; display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 24px; overflow-y: auto; flex: 1; }
        .grab-field { margin-bottom: 16px; }
        .grab-field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #112A61; }
        .grab-field input, .grab-field textarea, .grab-field select { width: 100%; padding: 11px; border: 2px solid #EAEFF5; border-radius: 8px; font-size: 14px; background: #fff; }
        
        .form-map-container { width: 100%; height: 200px; border-radius: 12px; border: 2px solid #0F172A; margin-top: 6px; }
        .drawer-footer { padding: 20px 24px; border-top: 1px solid #EAEFF5; background: #FCFDFE; }
        .grab-submit-btn { width: 100%; padding: 15px; background: #E25C80; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; }
        .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.3); z-index: 2500; }

        .order-receipt-box { background: #F8FAFC; border: 2px dashed #4A90E2; border-radius: 16px; padding: 20px; margin-top: 15px; }
        .tracking-id-badge { background: #112A61; color: #38BDF8; font-family: monospace; font-size: 18px; padding: 8px 14px; border-radius: 8px; display: inline-block; font-weight: 800; margin: 10px 0; }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 800; display: inline-block; }
    </style>
</head>
