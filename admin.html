<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA | Owner Admin Portal (Firebase)</title>
    <link rel="icon" type="image/png" href="Logo.png">

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: radial-gradient(circle at 50% 30%, #E6F7FF 0%, #C4ECFF 70%, #B5E6FF 100%) fixed;
            margin: 0;
            padding: 0;
            color: #1A365D;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #BCE3FF;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-graphic { width: 44px; height: 44px; object-fit: contain; }
        .logo { font-size: 28px; font-weight: 900; color: #112A61; display: flex; align-items: center; gap: 10px; }
        .logo .korean-divider { color: #CBD5E1; font-weight: 300; font-size: 24px; }
        .logo .korean-text { font-family: "Malgun Gothic", sans-serif; font-size: 23px; font-weight: 800; color: #E25C80; }
        .admin-badge { background: #112A61; color: #38BDF8; font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 20px; }

        .main-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .admin-panel-card { background: #FFFFFF; border-radius: 24px; border: 2px solid #EAEFF5; padding: 32px; box-shadow: 0 12px 36px rgba(17, 42, 97, 0.08); }

        .tab-menu { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #EAEFF5; padding-bottom: 12px; }
        .tab-btn { background: #EDF5FF; color: #112A61; border: 2px solid #BCE3FF; padding: 10px 20px; font-weight: 800; border-radius: 12px; cursor: pointer; }
        .tab-btn.active { background: #112A61; color: #FFFFFF; border-color: #112A61; }

        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #F4F8FC; padding-bottom: 15px; margin-bottom: 20px; }
        .panel-title { margin: 0; font-size: 22px; font-weight: 800; color: #112A61; }

        .delete-single-btn { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; padding: 6px 12px; font-weight: 700; font-size: 13px; border-radius: 8px; cursor: pointer; margin-left: 10px; }
        .delete-single-btn:hover { background: #EF4444; color: white; }

        .admin-card { background: #FCFDFE; border: 2px solid #EAEFF5; border-radius: 16px; padding: 20px; margin-bottom: 18px; }
        .admin-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #EAEFF5; padding-bottom: 12px; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }

        .tracking-id { background: #112A61; color: #38BDF8; font-family: monospace; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 15px; }
        .donor-id { background: #E25C80; color: #FFFFFF; font-family: monospace; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 15px; }
        .status-select { padding: 6px 12px; border-radius: 8px; border: 2px solid #BCE3FF; font-weight: 700; color: #112A61; background: #FFFFFF; }
        .info-body { font-size: 14.5px; line-height: 1.6; color: #4A5568; }
        .empty-state { text-align: center; padding: 50px 20px; color: #64748B; font-weight: 600; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Logo.png" alt="UMMA Logo" class="logo-graphic" onerror="this.style.display='none'">
        <div class="logo">
            UMMA <div class="korean-divider">|</div> <div class="korean-text">엄마</div>
        </div>
    </div>
    <div class="admin-badge">FIREBASE ADMIN PORTAL</div>
</header>

<div class="main-container">
    <div class="admin-panel-card">
        
        <div class="tab-menu">
            <button class="tab-btn active" id="tabOrdersBtn" onclick="switchTab('orders')">📦 Customer Orders</button>
            <button class="tab-btn" id="tabDonorsBtn" onclick="switchTab('donors')">🥛 Milk Donors</button>
        </div>

        <!-- ORDERS SECTION -->
        <div id="ordersSection">
            <div class="panel-header">
                <div>
                    <h2 class="panel-title">Customer Live Orders (Firebase)</h2>
                    <span style="font-size: 13px; color: #64748B;">Real-time sync direct from Firebase database.</span>
                </div>
            </div>
            <div id="adminOrdersContainer"></div>
        </div>

        <!-- DONORS SECTION -->
        <div id="donorsSection" style="display: none;">
            <div class="panel-header">
                <div>
                    <h2 class="panel-title">Milk Donor Applications (Firebase)</h2>
                    <span style="font-size: 13px; color: #64748B;">Real-time donor collection records.</span>
                </div>
            </div>
            <div id="adminDonorsContainer"></div>
        </div>

    </div>
</div>

<!-- FIREBASE SDK SCRIPTS -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "IMONG_API_KEY",
        authDomain: "umma-milk-system-7bb00.firebaseapp.com",
        databaseURL: "https://umma-milk-system-7bb00-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "umma-milk-system-7bb00",
        storageBucket: "umma-milk-system-7bb00.appspot.com",
        messagingSenderId: "IMONG_SENDER_ID",
        appId: "IMONG_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentTab = 'orders';

    window.switchTab = function(tab) {
        currentTab = tab;
        if (tab === 'orders') {
            document.getElementById('ordersSection').style.display = 'block';
            document.getElementById('donorsSection').style.display = 'none';
            document.getElementById('tabOrdersBtn').classList.add('active');
            document.getElementById('tabDonorsBtn').classList.remove('active');
        } else {
            document.getElementById('ordersSection').style.display = 'none';
            document.getElementById('donorsSection').style.display = 'block';
            document.getElementById('tabOrdersBtn').classList.remove('active');
            document.getElementById('tabDonorsBtn').classList.add('active');
        }
    }

    // REAL-TIME ORDERS LISTENER
    const ordersRef = ref(db, 'umma_orders');
    onValue(ordersRef, (snapshot) => {
        const container = document.getElementById('adminOrdersContainer');
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = `<div class="empty-state"><h3>No Customer Orders Found in Firebase</h3><p>Orders submitted from your form will appear here instantly.</p></div>`;
            return;
        }

        container.innerHTML = Object.entries(data).map(([firebaseKey, order]) => `
            <div class="admin-card">
                <div class="admin-card-header">
                    <div>
                        <span class="tracking-id">${order.id || 'N/A'}</span>
                        <span style="font-size: 12px; color: #64748B; margin-left: 10px;">Placed: ${order.date || 'N/A'}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: 700; color: #112A61;">Status:</label>
                        <select class="status-select" onchange="updateOrderStatus('${firebaseKey}', this.value)">
                            <option value="Order Received" ${order.status === 'Order Received' ? 'selected' : ''}>Order Received</option>
                            <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                            <option value="In Transit" ${order.status === 'In Transit' ? 'selected' : ''}>In Transit</option>
                            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                        <button class="delete-single-btn" onclick="deleteOrder('${firebaseKey}')">✕ Delete</button>
                    </div>
                </div>
                <div class="info-body">
                    <p style="margin: 4px 0;"><strong>Customer:</strong> ${order.customerName || 'N/A'} | <strong>Phone:</strong> ${order.phone || 'N/A'}</p>
                    <p style="margin: 4px 0;"><strong>Product:</strong> ${order.productName || 'N/A'} (${order.quantity || 'N/A'})</p>
                    <p style="margin: 4px 0;"><strong>Hub:</strong> ${order.hub || 'N/A'}</p>
                    <p style="margin: 4px 0; color: #112A61;"><strong>Address:</strong> ${order.address || 'N/A'}</p>
                </div>
            </div>
        `).join('');
    });

    // REAL-TIME DONORS LISTENER
    const donorsRef = ref(db, 'umma_donors');
    onValue(donorsRef, (snapshot) => {
        const container = document.getElementById('adminDonorsContainer');
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = `<div class="empty-state"><h3>No Donor Applications Found in Firebase</h3><p>Donor forms submitted will show up here instantly.</p></div>`;
            return;
        }

        container.innerHTML = Object.entries(data).map(([firebaseKey, donor]) => `
            <div class="admin-card">
                <div class="admin-card-header">
                    <div>
                        <span class="donor-id">${donor.id || 'N/A'}</span>
                        <span style="font-size: 12px; color: #64748B; margin-left: 10px;">Applied: ${donor.date || 'N/A'}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label style="font-size: 13px; font-weight: 700; color: #112A61;">Status:</label>
                        <select class="status-select" onchange="updateDonorStatus('${firebaseKey}', this.value)">
                            <option value="Pending Collection" ${donor.status === 'Pending Collection' ? 'selected' : ''}>Pending Collection</option>
                            <option value="Collected" ${donor.status === 'Collected' ? 'selected' : ''}>Collected</option>
                        </select>
                        <button class="delete-single-btn" onclick="deleteDonor('${firebaseKey}')">✕ Delete</button>
                    </div>
                </div>
                <div class="info-body">
                    <p style="margin: 4px 0;"><strong>Donor Name:</strong> ${donor.name || 'N/A'} | <strong>Phone:</strong> ${donor.phone || 'N/A'}</p>
                    <p style="margin: 4px 0;"><strong>Volume:</strong> ${donor.volume || 'N/A'} | <strong>Expression Date:</strong> ${donor.exprDate || 'N/A'}</p>
                    <p style="margin: 4px 0; color: #112A61;"><strong>Pickup Address:</strong> ${donor.address || 'N/A'}</p>
                </div>
            </div>
        `).join('');
    });

    // Global Database Update/Delete Functions
    window.updateOrderStatus = function(key, newStatus) {
        update(ref(db, `umma_orders/${key}`), { status: newStatus });
    }

    window.deleteOrder = function(key) {
        if (confirm("Delete this order from Firebase?")) {
            remove(ref(db, `umma_orders/${key}`));
        }
    }

    window.updateDonorStatus = function(key, newStatus) {
        update(ref(db, `umma_donors/${key}`), { status: newStatus });
    }

    window.deleteDonor = function(key) {
        if (confirm("Delete this donor application from Firebase?")) {
            remove(ref(db, `umma_donors/${key}`));
        }
    }
</script>

</body>
</html>
