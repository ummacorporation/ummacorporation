<!-- ========================================== -->
<!-- UMMA admin.html (Admin Management Portal) -->
<!-- ========================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMA Admin Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">UMMA Admin Dashboard</div>
            <ul class="nav-links">
                <li><a href="index.html">Back to Main Site</a></li>
            </ul>
        </nav>
    </header>

    <main class="admin-container">
        <section>
            <h2>Customer Orders</h2>
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </section>

        <section>
            <h2>Milk Donor Applications</h2>
            <table id="donors-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Volume (ml)</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="db.js"></script>
    <script>
        // Render Admin Tables on Load
        document.addEventListener("DOMContentLoaded", () => {
            loadAdminData();
        });

        function loadAdminData() {
            // Render Orders
            const ordersTableBody = document.querySelector("#orders-table tbody");
            ordersTableBody.innerHTML = "";
            const orders = db.getOrders();
            orders.forEach(order => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.customerName}</td>
                    <td>${order.product}</td>
                    <td>${order.phone}</td>
                    <td>${order.address}</td>
                    <td>
                        <select onchange="updateOrderStatus('${order.id}', this.value)">
                            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Dispatched" ${order.status === 'Dispatched' ? 'selected' : ''}>Dispatched</option>
                            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                    </td>
                    <td><button onclick="removeOrder('${order.id}')">Delete</button></td>
                `;
                ordersTableBody.appendChild(row);
            });

            // Render Donors
            const donorsTableBody = document.querySelector("#donors-table tbody");
            donorsTableBody.innerHTML = "";
            const donors = db.getDonors();
            donors.forEach(donor => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${donor.id}</td>
                    <td>${donor.name}</td>
                    <td>${donor.phone}</td>
                    <td>${donor.volume}</td>
                    <td>${donor.address}</td>
                    <td>
                        <select onchange="updateDonorStatus('${donor.id}', this.value)">
                            <option value="Under Review" ${donor.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Approved" ${donor.status === 'Approved' ? 'selected' : ''}>Approved</option>
                            <option value="Collected" ${donor.status === 'Collected' ? 'selected' : ''}>Collected</option>
                        </select>
                    </td>
                    <td><button onclick="removeDonor('${donor.id}')">Delete</button></td>
                `;
                donorsTableBody.appendChild(row);
            });
        }

        function updateOrderStatus(id, status) {
            db.updateOrderStatus(id, status);
        }

        function updateDonorStatus(id, status) {
            db.updateDonorStatus(id, status);
        }

        function removeOrder(id) {
            if (confirm("Are you sure you want to delete this order?")) {
                db.deleteOrder(id);
                loadAdminData();
            }
        }

        function removeDonor(id) {
            if (confirm("Are you sure you want to delete this donor application?")) {
                db.deleteDonor(id);
                loadAdminData();
            }
        }
    </script>
</body>
</html>
